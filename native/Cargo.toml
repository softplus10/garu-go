[package]
name = "garu-go-ffi"
version = "0.12.1"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "garu_go"
crate-type = ["staticlib"]

[dependencies]
garu-core = { path = "../third_party/garu-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
